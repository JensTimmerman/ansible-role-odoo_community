---
# Role: odoo
# PostgreSQL for Odoo.
#
# On the EL family this optionally bootstraps the PGDG repository (and disables
# the distro postgresql module) first, then delegates provisioning of the
# server, the dedicated role + database, the loopback-only pg_hba and the
# restricted listener to the configured PostgreSQL role, and finally enables
# the unaccent extension the Odoo account/peppol stack expects.
#
# Auth model: loopback trust by default, or scram-sha-256 when odoo_db_password
# is set (see vars/main.yml). The listener is never bound to 0.0.0.0.

- name: "Check for the PGDG repository definition"
  ansible.builtin.stat:
    path: "{{ odoo_pgdg_repo_file }}"
  register: "odoo_pgdg_repo"
  changed_when: false
  when:
    - "ansible_os_family == 'RedHat'"
    - "odoo_manage_pgdg_repo | bool"
  tags:
    - "odoo"
    - "postgresql"

- name: "Bootstrap the PGDG repository RPM"
  ansible.builtin.dnf:
    name: "{{ odoo_pgdg_repo_rpm }}"
    state: "present"
    # Bootstrap RPM's signing key is not in the keyring yet.
    disable_gpg_check: true
  when:
    - "ansible_os_family == 'RedHat'"
    - "odoo_manage_pgdg_repo | bool"
    - "not odoo_pgdg_repo.stat.exists | default(false)"
  tags:
    - "odoo"
    - "postgresql"

- name: "Check whether the distro postgresql module is enabled"
  ansible.builtin.command:
    cmd: "dnf -qy module list --enabled postgresql"
  register: "odoo_pgdg_postgresql_module"
  changed_when: false
  failed_when: false
  when:
    - "ansible_os_family == 'RedHat'"
    - "odoo_manage_pgdg_repo | bool"
  tags:
    - "odoo"
    - "postgresql"

- name: "Disable the distro postgresql module (PGDG provides the server)"
  ansible.builtin.command:
    cmd: "dnf -qy module disable postgresql"
  changed_when: true
  when:
    - "ansible_os_family == 'RedHat'"
    - "odoo_manage_pgdg_repo | bool"
    - "'postgresql' in (odoo_pgdg_postgresql_module.stdout | default(''))"
  tags:
    - "odoo"
    - "postgresql"

- name: "Ensure dnf-plugins-core is present (provides dnf config-manager)"
  ansible.builtin.dnf:
    name: "dnf-plugins-core"
    state: "present"
  when: "ansible_os_family == 'RedHat'"
  tags:
    - "odoo"
    - "postgresql"

# The builder repository (CRB / CodeReady Builder) ships perl(IPC::Run), which
# the PGDG postgresql*-devel RPMs require. Its repo id is platform-specific:
#   Rocky/Alma/CentOS .. crb
#   RHEL .............. codeready-builder-for-rhel-9-<arch>-rpms
#   UBI9 .............. ubi-9-codeready-builder-rpms (enabled in the image)
# RHEL/UBI both report ansible_distribution == "RedHat"; UBI ships its own
# /etc/yum.repos.d/ubi.repo, RHEL's repos come from subscription-manager.
- name: "Check for a UBI repository definition (distinguishes UBI9 from RHEL)"
  ansible.builtin.stat:
    path: "/etc/yum.repos.d/ubi.repo"
  register: "odoo_ubi_repo_file"
  changed_when: false
  when: "ansible_os_family == 'RedHat'"
  tags:
    - "odoo"
    - "postgresql"

- name: "Determine the EL9 builder (CRB) repository id"
  ansible.builtin.set_fact:
    odoo_builder_repo_id: >-
      {{ 'crb'
         if ansible_facts['distribution'] in ['Rocky', 'AlmaLinux', 'CentOS', 'Virt']
         else (('ubi-' ~ ansible_facts['distribution_major_version'] ~ '-codeready-builder-rpms')
               if (odoo_ubi_repo_file.stat.exists | default(false))
               else ('codeready-builder-for-rhel-' ~ ansible_facts['distribution_major_version'] ~ '-' ~ ansible_facts['architecture'] ~ '-rpms')) }}
  when: "ansible_os_family == 'RedHat'"
  tags:
    - "odoo"
    - "postgresql"

- name: "Check whether the EL9 builder (CRB) repository is enabled"
  ansible.builtin.command:
    cmd: "dnf repolist --enabled {{ odoo_builder_repo_id }}"
  register: "odoo_builder_repo"
  changed_when: false
  failed_when: false
  when: "ansible_os_family == 'RedHat'"
  tags:
    - "odoo"
    - "postgresql"

# Base/AppStream leave the builder repo disabled, so the PGDG -devel depsolve
# otherwise fails; UBI enables its builder repo already, so this is a no-op.
- name: "Enable the EL9 builder (CRB) repository for PGDG -devel dependencies"
  ansible.builtin.command:
    cmd: "dnf config-manager --set-enabled {{ odoo_builder_repo_id }}"
  when:
    - "ansible_os_family == 'RedHat'"
    - "odoo_builder_repo_id not in (odoo_builder_repo.stdout | default(''))"
  changed_when: true
  tags:
    - "odoo"
    - "postgresql"

- name: "Install and configure PostgreSQL for Odoo (PGDG v{{ odoo_postgresql_version }})"
  ansible.builtin.include_role:
    name: "{{ odoo_postgresql_role_name }}"
  vars:
    postgresql_python_library: "{{ odoo_postgresql_python_library }}"
    postgresql_version: "{{ odoo_postgresql_version }}"
    postgresql_packages: "{{ odoo_postgresql_packages }}"
    postgresql_daemon: "{{ odoo_postgresql_service }}"
    postgresql_data_dir: "{{ odoo_postgresql_data_dir }}"
    postgresql_bin_path: "{{ odoo_postgresql_bin_path }}"
    postgresql_config_path: "{{ odoo_postgresql_config_path }}"
    postgresql_unix_socket_directories:
      - "{{ odoo_postgresql_socket }}"
    postgresql_global_config_options: "{{ odoo_postgresql_global_config_options }}"
    postgresql_hba_entries: "{{ odoo_postgresql_hba_entries }}"
    postgresql_databases: "{{ odoo_postgresql_databases }}"
    postgresql_users: "{{ odoo_postgresql_users }}"
  tags:
    - "odoo"
    - "postgresql"

# The delegated role rewrites pg_hba.conf/postgresql.conf and notifies its
# restart handler, but play handlers otherwise run only after every task --
# i.e. after the runtime phase already connected to PostgreSQL, reproducing
# "no pg_hba.conf entry". Flush now so the new pg_hba is live first.
- name: "Apply pending PostgreSQL config (flush the delegated role handlers)"
  ansible.builtin.meta: flush_handlers
  tags:
    - "odoo"
    - "postgresql"

- name: "Enable the unaccent extension in the Odoo database"
  become: true
  become_user: "postgres"
  community.postgresql.postgresql_ext:
    name: "unaccent"
    db: "{{ odoo_db_name }}"
    login_unix_socket: "{{ odoo_postgresql_socket }}"
    state: "present"
  tags:
    - "odoo"
    - "postgresql"
