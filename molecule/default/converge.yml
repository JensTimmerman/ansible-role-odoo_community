---
# Molecule converge for odoo.
# Delegated localhost run: validates the variable contract only. The
# PostgreSQL and Odoo runtime phases are disabled here (they install
# packages/start services and are not CI-runner safe), so converge stays
# read-only and idempotent. Live checks are covered by tasks/verify.yml on a
# real host.
- name: "Converge"
  hosts: "localhost"
  connection: "local"
  gather_facts: true
  tasks:
    - name: "Apply odoo role (contract only, no host mutation)"
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        odoo_config_admin_passwd: "converge-not-a-real-secret"
        odoo_base_url: "https://odoo.example.com"
        odoo_manage_postgresql: false
        odoo_manage_runtime: false
        odoo_manage_peppol: false
        odoo_manage_backups: false
        odoo_run_verify: true
