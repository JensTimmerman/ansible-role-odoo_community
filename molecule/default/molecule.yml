---
# Molecule scenario for odoo (default/delegated driver, container-free).
# The "default" driver IS the delegated driver: no containers, uses localhost
# with the local connection so CI/host runners without podman/docker can still
# execute converge + idempotence + verify against the read-only contract.
dependency:
  name: "galaxy"
  enabled: false
role_name_check: 1
driver:
  name: "default"
platforms:
  - name: "localhost"
    groups:
      - "odoo_test"
provisioner:
  name: "ansible"
  playbooks:
    converge: "converge.yml"
    verify: "verify.yml"
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: "local"
verifier:
  name: "ansible"
scenario:
  name: "default"
  test_sequence:
    - "dependency"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "verify"
    - "destroy"
