---
# Prepare: make a bare EL container able to run Ansible.
#
# The image ships dnf but no sudo; the provisioner connects over the docker
# connection as root, so the first task uses `raw` (no target interpreter
# required) to install the minimum Ansible needs. Everything after that runs
# through normal modules.
- name: "Prepare the container (bootstrap Ansible prerequisites)"
  hosts: "all"
  become: false
  gather_facts: false
  tasks:
    - name: "Install python3, sudo and dnf-plugins-core"
      ansible.builtin.raw: "dnf -y install python3 sudo dnf-plugins-core"
      changed_when: false

    # RHEL-family images (including the AlmaLinux *-init images, for which we
    # do not build Dockerfile.j2) ship /etc/shadow mode 0000; with recent runc
    # pam_unix/sudo/become then fail because the setuid unix_chkpwd helper has
    # no CAP_DAC_OVERRIDE. Make it owner-readable. Idempotent on Rocky, where
    # Dockerfile.j2 already did it.
    - name: "Make /etc/shadow owner-readable for PAM/sudo"
      ansible.builtin.file:
        path: "/etc/shadow"
        owner: "root"
        group: "root"
        mode: "0400"

    # EL images ship skip_if_unavailable=False in /etc/dnf/dnf.conf; a
    # transient metadata fetch failure for ANY enabled PGDG subrepo (the role's
    # bootstrap RPM enables pgdg14..18) otherwise fails every dnf task.
    - name: "Let dnf skip a temporarily unavailable repo (PGDG ships many subrepos)"
      ansible.builtin.lineinfile:
        path: "/etc/dnf/dnf.conf"
        regexp: '^skip_if_unavailable\s*='
        line: "skip_if_unavailable=True"
        state: "present"
        owner: "root"
        group: "root"
        mode: "0644"

    - name: "Wait for the container's systemd to finish booting"
      ansible.builtin.raw: "systemctl is-system-running --wait"
      register: "odoo_integration_systemd"
      changed_when: false
      failed_when: false
      retries: 30
      delay: 2
      until: "odoo_integration_systemd.stdout in ['running', 'degraded']"
