---
# Molecule scenario: REAL integration provisioning of the odoo role.
#
# The container-free `default` scenario is a read-only contract check: it sets
# every odoo_manage_* phase to false. This scenario is the opposite -- it boots
# a fresh rockylinux:9 container (the real target) and runs the MUTATING
# PostgreSQL + Odoo runtime phases, so CI fails exactly where a fresh EL9 host
# failed (see issue #4 / PR #5).
#
# systemd: the role starts PostgreSQL and Odoo through the systemd module. The
# rockylinux:9 base image ships systemd *unit files* but not the systemd package
# itself (no /usr/sbin/init), so Dockerfile.j2 builds a systemd-enabled image
# FROM rockylinux:9 and the container is booted with /usr/sbin/init. systemd
# needs to own its cgroup namespace and write the cgroup tree, hence
# `privileged` + the host cgroup mount + cgroupns_mode: host; `env:
# container=docker` lets systemd trim the units that cannot run in a container.
# This is the documented systemd-container recipe (molecule docker driver docs).
dependency:
  name: "galaxy"
  enabled: true
driver:
  name: "docker"
platforms:
  - name: "odoo-integration"
    image: "rockylinux:9"
    pre_build_image: false
    dockerfile: "Dockerfile.j2"
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    env:
      container: "docker"
    tty: true
provisioner:
  name: "ansible"
  playbooks:
    prepare: "prepare.yml"
    converge: "converge.yml"
    verify: "verify.yml"
verifier:
  name: "ansible"
scenario:
  name: "integration"
  # Deliberately no `idempotence` step: a second full converge re-clones the
  # Odoo source and re-resolves the virtualenv, which roughly doubles an
  # already heavy CI run (source clone + pip build + DB init). The `default`
  # scenario keeps the cheap contract idempotence check.
  test_sequence:
    - "dependency"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "verify"
    - "destroy"
