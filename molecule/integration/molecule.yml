---
# Molecule scenario: REAL integration provisioning of the odoo role.
#
# The container-free `default` scenario is a read-only contract check: it sets
# every odoo_manage_* phase to false. This scenario is the opposite -- it boots
# a fresh EL container and runs the MUTATING PostgreSQL + Odoo runtime phases,
# so CI fails exactly where a fresh EL host failed (see issue #4 / PR #5).
#
# The image and systemd approach are parameterised so CI can run one scenario
# across the EL family:
#   MOLECULE_ODOO_IMAGE      base image
#   MOLECULE_ODOO_PREBUILT   true when the image already runs systemd as PID 1
#                            (the AlmaLinux *-init images), so it is not built
#   MOLECULE_ODOO_PLATFORM   docker --platform (e.g. linux/amd64/v2)
#   ODOO_INTEGRATION_PYTHON_VERSION  "3.12" on EL9, "3" on EL10 (python3=3.12)
#
# This is a single scenario; the ternary values are interpolated as YAML before
# parsing, so `pre_build_image` stays a real boolean.
#
# CI matrix images:
#   - rockylinux/rockylinux:9   (built: it ships unit files, not the systemd pkg)
#   - almalinux/9-init          (prebuilt: systemd as PID 1, native x86-64-v2)
#   - almalinux/10-init         (prebuilt: systemd as PID 1, pulled linux/amd64/v2)
#
# AlmaLinux 10 caveat: PGDG's EL10 PostgreSQL packages are built for x86-64-v3.
# The Alma 10 v2 job only validates the OS/role plumbing; it does NOT prove
# PGDG-PostgreSQL runs on real x86-64-v2 hardware (CI runners are v3/v4, so the
# v3 packages execute there). Real v2 validation is done on the dev host.
dependency:
  name: "galaxy"
  enabled: true
driver:
  name: "docker"
platforms:
  - name: "odoo-integration"
    image: "${MOLECULE_ODOO_IMAGE:-rockylinux/rockylinux:9}"
    pre_build_image: ${MOLECULE_ODOO_PREBUILT:-false}
    platform: ${MOLECULE_ODOO_PLATFORM:-linux/amd64}
    pull: true
    dockerfile: "Dockerfile.j2"
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    env:
      container: "docker"
    tty: true
provisioner:
  name: "ansible"
  inventory:
    host_vars:
      odoo-integration:
        # The role installs python3.12 for Odoo's venv on EL9; pin Ansible to
        # the system python so the community.postgresql modules use the
        # psycopg2 that the delegated role installs (python3-psycopg2).
        ansible_python_interpreter: "/usr/bin/python3"
        # EL10 ships python3 == 3.12 (no python3.12 package); the matrix passes
        # "3" there so the role uses the unversioned packages/interpreter.
        odoo_python_version: "${ODOO_INTEGRATION_PYTHON_VERSION:-3.12}"
  playbooks:
    prepare: "prepare.yml"
    converge: "converge.yml"
    verify: "verify.yml"
verifier:
  name: "ansible"
scenario:
  name: "integration"
  # Deliberately no `idempotence` step: a second full converge re-clones the
  # Odoo source and re-resolves the virtualenv, which roughly doubles an
  # already heavy CI run (source clone + pip build + DB init). The `default`
  # scenario keeps the cheap contract idempotence check.
  test_sequence:
    - "dependency"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "verify"
    - "destroy"
