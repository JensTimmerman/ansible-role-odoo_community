---
# Converge: provision the FULL target on the container.
#
# Unlike the `default` scenario, the mutating phases are ENABLED here, so the
# real fresh-EL9 work happens: PGDG repo + builder repo, PostgreSQL server/role/
# DB with a live pg_hba, and the Odoo source clone + Python virtualenv + systemd
# service.
#
# Peppol is OFF by default. Installing the account module and running the ORM
# defaults script on top of the full Odoo source build would push a single CI
# run well past a sensible budget, so this scenario exercises the PostgreSQL +
# runtime gaps (1-6 in #4) and leaves gap 7 to the flag: export
# ODOO_INTEGRATION_PEPPOL=true (or set odoo_manage_peppol: true) to also cover
# the scripts dir + `odoo-bin shell --no-http` path.
- name: "Converge the odoo role (real PostgreSQL + runtime on EL9)"
  hosts: "all"
  become: true
  gather_facts: true
  vars:
    # Dummy value: the role never ships a master password but requires one.
    odoo_config_admin_passwd: "integration-not-a-real-secret"
    odoo_base_url: "https://odoo.integration.example"
    # The scenario requirements.yml pins geerlingguy.postgresql; delegate to it.
    odoo_postgresql_role_name: "geerlingguy.postgresql"
    odoo_manage_postgresql: true
    odoo_manage_runtime: true
    odoo_manage_peppol: >-
      {{ (lookup('ansible.builtin.env', 'ODOO_INTEGRATION_PEPPOL') | default('false', true)) | bool }}
    odoo_manage_backups: false
    odoo_run_verify: true
  tasks:
    # UBI9's *public* repos are a subset of RHEL's and omit two packages the
    # role's defaults pull in:
    #   - perl(IPC::Run), required by PGDG postgresql*-devel (its public CRB
    #     repo is a subset). UBI's base libpq-devel still provides pg_config,
    #     so the psycopg2 build works without the PGDG -devel RPM.
    #   - xorg-x11-fonts-75dpi, required by the upstream wkhtmltopdf RPM.
    # Entitled RHEL 9 and Rocky/Alma/CentOS ship both in their builder/base
    # repos; only the no-subscription UBI run needs this trim. set_fact
    # outranks the role's include_vars, so these override vars/RedHat.yml.
    - name: "Select UBI-compatible packages (public UBI repos are a subset)"
      ansible.builtin.set_fact:
        odoo_postgresql_packages:
          - "postgresql{{ odoo_postgresql_version | default('16') }}-server"
          - "postgresql{{ odoo_postgresql_version | default('16') }}"
          - "postgresql{{ odoo_postgresql_version | default('16') }}-contrib"
        odoo_wkhtmltopdf_packages: []
      when: "odoo_integration_ubi | default(false) | bool"

    - name: "Apply the odoo role (mutating PostgreSQL + runtime phases enabled)"
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
