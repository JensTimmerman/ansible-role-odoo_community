---
# Collections required by the odoo_community role (used by CI and consumers).
collections:
  # The role uses the canonical `login_db` option, which 5.x requires (the
  # deprecated `db` alias is gone there). Keep the upper bound until the
  # integration scenario has been validated against 5.x; lift it then.
  - name: "community.postgresql"
    version: ">=3.0.0,<5.0.0"
