---
# OS-specific variables for Debian / Ubuntu (PGDG PostgreSQL).

odoo_postgresql_service: "postgresql"
odoo_postgresql_packages:
  - "postgresql-{{ odoo_postgresql_version }}"
  - "postgresql-contrib"
odoo_postgresql_data_dir: "/var/lib/postgresql/{{ odoo_postgresql_version }}/main"
odoo_postgresql_bin_path: "/usr/lib/postgresql/{{ odoo_postgresql_version }}/bin"
odoo_postgresql_config_path: "/etc/postgresql/{{ odoo_postgresql_version }}/main"
odoo_postgresql_socket: "/var/run/postgresql"

# Odoo build/runtime dependencies for Debian / Ubuntu (apt).
odoo_python_executable: "/usr/bin/python{{ odoo_python_version }}"
odoo_system_packages:
  - "python{{ odoo_python_version }}"
  - "python{{ odoo_python_version }}-venv"
  - "python{{ odoo_python_version }}-dev"
  - "git"
  - "gcc"
  - "g++"
  - "make"
  - "libldap2-dev"
  - "libpq-dev"
  - "libsasl2-dev"
  - "libxml2-dev"
  - "libxslt1-dev"
  - "libjpeg-dev"
  - "libfreetype6-dev"
  - "libbz2-dev"
  - "libffi-dev"
  - "nodejs"
  - "gettext"

# wkhtmltopdf 0.12.6 from the archived upstream packaging .deb (not pip).
odoo_wkhtmltopdf_packages:
  - "https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.bookworm_amd64.deb"
