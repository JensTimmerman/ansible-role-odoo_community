---
galaxy_info:
  role_name: "odoo_community"
  author: "jenstimmerman"
  description: >-
    Unofficial, community-maintained Ansible role for the Odoo Community
    runtime (PostgreSQL, Python virtualenv, hardened systemd service, optional
    Peppol e-invoicing and backups). Not affiliated with, endorsed by, or
    sponsored by Odoo S.A.; installs Odoo Community (LGPLv3) only.
  company: "Jens Timmerman"
  license: "GPL-3.0-or-later"
  min_ansible_version: "2.11"

  # Only the EL 9 family is tested/validated: Rocky Linux 9 (full provisioning,
  # CI) and Red Hat UBI 9 (CI; same RHEL-family codeready-builder repo id, but
  # UBI's public CRB is a subset that lacks perl(IPC::Run) -- see the
  # molecule/integration scenario for the documented caveat). Entitled RHEL 9
  # uses codeready-builder-for-rhel-9-<arch>-rpms and is expected to work the
  # same way. Debian/Ubuntu were never tested and the hardening path uses
  # EL-only tooling (dnf, builder repo); do not claim them.
  platforms:
    - name: "EL"
      versions:
        - "9"

  galaxy_tags:
    - "odoo"
    - "erp"
    - "postgresql"
    - "peppol"

dependencies: []
