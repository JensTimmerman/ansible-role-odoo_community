---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  # Molecule integration image (rockylinux). NOTE: the tag is the floating
  # ':9' and the FROM lives in Dockerfile.j2, so Dependabot may not bump it;
  # it only proposes updates for pinned tags (e.g. ':9.8') / plain Dockerfiles.
  - package-ecosystem: "docker"
    directory: "/molecule/integration"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Stay on EL9: RHEL/Rocky/Alma 10 require x86-64-v3, while the target
    # hosts are x86-64-v2 (e.g. Xeon E5-2690 v2: no AVX2/BMI2). Never propose
    # the el10 major bump.
    ignore:
      - dependency-name: "rockylinux/rockylinux"
        update-types: ["version-update:semver-major"]
