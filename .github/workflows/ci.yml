---
name: "CI"

on:
  push:
  pull_request:

jobs:
  lint:
    name: "yamllint + ansible-lint"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v4"

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"

      - name: "Install lint tools"
        run: "pip install yamllint ansible-lint ansible-core"

      - name: "Install required collections"
        run: "ansible-galaxy collection install -r requirements.yml"

      - name: "Run yamllint"
        run: "yamllint ."

      - name: "Run ansible-lint (production profile)"
        run: "ansible-lint --profile production"

  molecule:
    name: "molecule (default scenario)"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v4"
        with:
          path: "${{ github.repository }}"

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"

      - name: "Install molecule"
        run: "pip install molecule ansible-core"

      - name: "Install required collections"
        working-directory: "${{ github.repository }}"
        run: "ansible-galaxy collection install -r requirements.yml"

      - name: "Run molecule"
        working-directory: "${{ github.repository }}"
        run: "molecule test"

  # Real integration: boot a fresh EL9 container and provision the mutating
  # PostgreSQL + Odoo runtime phases. Runs on Rocky Linux (builder repo 'crb')
  # and on Red Hat UBI 9 (RHEL-family codeready-builder repo id; UBI's public
  # CRB is a subset without perl(IPC::Run), handled by the scenario). The
  # scenario installs its own pinned role (geerlingguy.postgresql 4.2.0) and
  # collections through molecule's enabled galaxy dependency.
  integration:
    name: "molecule (integration, ${{ matrix.name }})"
    runs-on: "ubuntu-latest"
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "rockylinux9"
            image: "rockylinux/rockylinux:9"
            ubi: "false"
          - name: "ubi9 (rhel family)"
            image: "registry.access.redhat.com/ubi9/ubi"
            ubi: "true"
    env:
      MOLECULE_ODOO_IMAGE: "${{ matrix.image }}"
      ODOO_INTEGRATION_UBI: "${{ matrix.ubi }}"
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v4"
        with:
          path: "${{ github.repository }}"

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"

      - name: "Install molecule and the docker driver"
        run: "pip install molecule molecule-plugins[docker] ansible-core"

      # Pre-install the driver's required collections (community.docker,
      # ansible.posix) plus the scenario's (community.postgresql). ansible-compat
      # checks installed paths before calling Galaxy, so this stops molecule's
      # in-run require_collection from hitting Galaxy (which intermittently
      # returns a cache entry without 'results'). Retry on the flaky response.
      - name: "Pre-install the driver + scenario collections"
        working-directory: "${{ github.repository }}"
        run: |
          for i in 1 2 3; do
            ansible-galaxy collection install -r molecule/integration/collections.yml && exit 0
            echo "ansible-galaxy attempt ${i} failed; clearing cache and retrying"
            rm -rf "${HOME}/.ansible/galaxy_cache"
            sleep 15
          done
          echo "ansible-galaxy collection install failed after 3 attempts" >&2
          exit 1

      - name: "Run the integration scenario (docker: ${{ matrix.name }})"
        working-directory: "${{ github.repository }}"
        run: "molecule test -s integration"
