---
name: "CI"

on:
  push:
  pull_request:

jobs:
  lint:
    name: "yamllint + ansible-lint"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"

      - name: "Install lint tools"
        run: "pip install yamllint ansible-lint ansible-core"

      - name: "Install required collections"
        run: "ansible-galaxy collection install -r requirements.yml"

      - name: "Run yamllint"
        run: "yamllint ."

      - name: "Run ansible-lint (production profile)"
        run: "ansible-lint --profile production"

  molecule:
    name: "molecule (default scenario)"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7"
        with:
          path: "${{ github.repository }}"

      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"

      - name: "Install molecule"
        run: "pip install molecule ansible-core"

      - name: "Install required collections"
        working-directory: "${{ github.repository }}"
        run: "ansible-galaxy collection install -r requirements.yml"

      - name: "Run molecule"
        working-directory: "${{ github.repository }}"
        run: "molecule test"

  # Real integration: boot a fresh EL container and provision the mutating
  # PostgreSQL + Odoo runtime phases across the EL family:
  #   - rockylinux9    rockylinux/rockylinux:9 (built: adds systemd)
  #   - almalinux9     almalinux/9-init        (systemd as PID 1, native v2)
  #   - almalinux10-v2 almalinux/10-init       (systemd as PID 1, pulled v2)
  # The scenario installs its own pinned role (geerlingguy.postgresql 4.2.0) and
  # collections through molecule's enabled galaxy dependency.
  #
  # AlmaLinux 10 caveat: PGDG's EL10 PostgreSQL packages are built for
  # x86-64-v3. The almalinux10-v2 job validates the OS/role plumbing on a v2
  # image on a v3/v4 runner; it does NOT prove PGDG-PostgreSQL runs on real
  # x86-64-v2 hardware.
  integration:
    name: "molecule (integration, ${{ matrix.name }})"
    runs-on: "ubuntu-latest"
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "rockylinux9"
            image: "rockylinux/rockylinux:9"
            prebuilt: "false"
            pull: "false"
            platform: "linux/amd64"
            python_version: "3.12"
          - name: "almalinux9"
            image: "almalinux/9-init"
            prebuilt: "true"
            pull: "true"
            platform: "linux/amd64"
            python_version: "3.12"
          - name: "almalinux10-v2"
            image: "almalinux/10-init"
            prebuilt: "true"
            pull: "true"
            platform: "linux/amd64/v2"
            python_version: "3"
    env:
      MOLECULE_ODOO_IMAGE: "${{ matrix.image }}"
      MOLECULE_ODOO_PREBUILT: "${{ matrix.prebuilt }}"
      MOLECULE_ODOO_PULL: "${{ matrix.pull }}"
      MOLECULE_ODOO_PLATFORM: "${{ matrix.platform }}"
      ODOO_INTEGRATION_PYTHON_VERSION: "${{ matrix.python_version }}"
      # The docker driver exposes `platform`; this also pins pulls/runs so the
      # AlmaLinux 10 v2 manifest is selected even if a layer is cached.
      DOCKER_DEFAULT_PLATFORM: "${{ matrix.platform }}"
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7"
        with:
          path: "${{ github.repository }}"

      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"

      - name: "Install molecule and the docker driver"
        run: "pip install molecule molecule-plugins[docker] ansible-core"

      # Pre-install the driver's required collections (community.docker,
      # ansible.posix) plus the scenario's (community.postgresql). ansible-compat
      # checks installed paths before calling Galaxy, so this stops molecule's
      # in-run require_collection from hitting Galaxy (which intermittently
      # returns a cache entry without 'results'). Retry on the flaky response.
      - name: "Pre-install the driver + scenario collections"
        working-directory: "${{ github.repository }}"
        run: |
          for i in 1 2 3; do
            ansible-galaxy collection install -r molecule/integration/collections.yml && exit 0
            echo "ansible-galaxy attempt ${i} failed; clearing cache and retrying"
            rm -rf "${HOME}/.ansible/galaxy_cache"
            sleep 15
          done
          echo "ansible-galaxy collection install failed after 3 attempts" >&2
          exit 1

      - name: "Run the integration scenario (docker: ${{ matrix.name }})"
        working-directory: "${{ github.repository }}"
        run: "molecule test -s integration"
